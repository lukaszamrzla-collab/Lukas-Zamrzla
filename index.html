              body: formData,
              headers: { 'Accept': 'application/json' }

            } else {
              setFormStatus('error');
            }

            setFormStatus('error');
          }

                          h(Icon, { name: 'phone', className: 'w-5 h-5' })
                        ),
                        h('div', null,
                          h('div', { className: 'text-sm text-white/50' }, 'WhatsApp / Direct'),
                          h('a', { href: 'tel:+971502309663', className: 'text-lg font-bold hover:text-[#D4AF37] transition-colors' }, '+971 50 230 9663')
                        )
                      ),
                      h('div', { className: 'flex items-center gap-4' },
                        h('div', { className: 'w-12 h-12 rounded-full bg-white/5 flex items-center justify-center text-[#D4AF37]' },
                          h(Icon, { name: 'mail', className: 'w-5 h-5' })
                        ),
                        h('div', null,
                          h('div', { className: 'text-sm text-white/50' }, 'Email'),
                          h('a', { href: 'mailto:ask@lukaszamrzla.com', className: 'text-lg font-bold hover:text-[#D4AF37] transition-colors' }, 'ask@lukaszamrzla.com')
                        )
                      ),
                      h('div', { className: 'flex items-center gap-4' },
                        h('div', { className: 'w-12 h-12 rounded-full bg-white/5 flex items-center justify-center text-[#D4AF37]' },
                          h(Icon, { name: 'map-pin', className: 'w-5 h-5' })
                        ),
                        h('div', null,
                          h('div', { className: 'text-sm text-white/50' }, 'Location'),
                          h('div', { className: 'text-lg font-bold' }, 'Abu Dhabi, United Arab Emirates')
                        )
                      )
                    )
                  ),

                  /* Form (text-base prevents iOS Safari auto-zoom on tap) */
                  h('div', { className: 'bg-[#0A0F1D]/80 p-8 rounded-3xl border border-white/10 shadow-2xl' },
                    h('h3', { className: 'text-2xl font-bold mb-6' }, t.contact.formTitle),
                    h('form', { onSubmit: handleFormSubmit, className: 'space-y-4' },
                      h('div', { className: 'grid grid-cols-1 sm:grid-cols-2 gap-4' },
                        h('div', null,
                          h('label', { className: 'block text-xs font-bold text-white/50 mb-2 uppercase tracking-wider' }, t.contact.name),
                          h('input', { type: 'text', name: 'name', required: true, className: 'w-full bg-[#131B2E] border border-white/10 rounded-xl px-4 py-3 text-base text-white focus:outline-none focus:border-[#D4AF37] transition-colors' })
                        ),
                        h('div', null,
                          h('label', { className: 'block text-xs font-bold text-white/50 mb-2 uppercase tracking-wider' }, t.contact.company),
                          h('input', { type: 'text', name: 'company', className: 'w-full bg-[#131B2E] border border-white/10 rounded-xl px-4 py-3 text-base text-white focus:outline-none focus:border-[#D4AF37] transition-colors' })
                        )
                      ),
                      h('div', null,
                        h('label', { className: 'block text-xs font-bold text-white/50 mb-2 uppercase tracking-wider' }, t.contact.website),
                        h('input', { type: 'text', name: 'website', className: 'w-full bg-[#131B2E] border border-white/10 rounded-xl px-4 py-3 text-base text-white focus:outline-none focus:border-[#D4AF37] transition-colors' })
                      ),
                      h('div', null,
                        h('label', { className: 'block text-xs font-bold text-white/50 mb-2 uppercase tracking-wider' }, t.contact.interest),
                        h('select', { name: 'interest', className: 'w-full bg-[#131B2E] border border-white/10 rounded-xl px-4 py-3 text-base text-white focus:outline-none focus:border-[#D4AF37] transition-colors' },
                          h('option', null, t.contact.opt1),
                          h('option', null, t.contact.opt2),
                          h('option', null, t.contact.opt3)
                        )
                      ),
                      h('div', null,
                        h('label', { className: 'block text-xs font-bold text-white/50 mb-2 uppercase tracking-wider' }, t.contact.msg),
                        h('textarea', { name: 'message', rows: 3, className: 'w-full bg-[#131B2E] border border-white/10 rounded-xl px-4 py-3 text-base text-white focus:outline-none focus:border-[#D4AF37] transition-colors resize-none' })
                      ),
                      h('button', {
                        type: 'submit',
                        disabled: formStatus === 'submitting',
                        className: 'w-full bg-[#D4AF37] hover:bg-[#C5A059] disabled:opacity-50 text-[#0A0F1D] font-bold py-4 rounded-xl transition-all shadow-[0_0_15px_rgba(212,175,55,0.2)] mt-4 flex items-center justify-center gap-2'
                      }, formStatus === 'submitting' ? t.contact.submitting : t.contact.submit)
                    )
                  )
                ),

                /* Footer Bar */
                h('div', { className: 'mt-24 pt-8 border-t border-white/10 flex flex-col md:flex-row justify-between items-center gap-4' },
                  h('div', { className: 'flex items-center gap-1' },
                    h('span', { className: 'text-xl font-bold tracking-widest text-white/50' }, 'LUKAS ZAMRZLA'),
                    h('span', { className: 'w-1.5 h-1.5 rounded-full bg-[#D4AF37]/50 mb-1' })
                  ),
                  h('div', { className: 'text-sm text-white/40' }, '© 2026 Lukas Zamrzla. All rights reserved.'),
                  h('div', { className: 'flex gap-4' },
                    h('a', { href: 'https://linkedin.com/in/zamrzla', target: '_blank', rel: 'noreferrer', className: 'text-white/40 hover:text-[#D4AF37] transition-colors text-sm font-medium' }, 'LinkedIn')
                  )
                )
              )
            )
          ),

          /* FORM SUBMISSION MODAL */
          formStatus !== 'idle' && formStatus !== 'submitting' && h('div', { className: 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md' },
            h('div', { className: 'bg-[#131B2E] border border-[#D4AF37]/40 rounded-3xl p-8 max-w-md w-full shadow-[0_0_50px_rgba(212,175,55,0.2)] text-center relative' },
              h('button', {
                type: 'button',
                onClick: () => setFormStatus('idle'),
                className: 'absolute top-4 right-4 text-white/50 hover:text-white p-2'
              }, h(Icon, { name: 'x', className: 'w-5 h-5' })),
              formStatus === 'success'
                ? h('div', null,
                    h('div', { className: 'w-16 h-16 rounded-full bg-[#D4AF37]/10 border border-[#D4AF37]/30 flex items-center justify-center mx-auto mb-4 text-[#D4AF37]' },
                      h(Icon, { name: 'check-circle-2', className: 'w-8 h-8' })
                    ),
                    h('h3', { className: 'text-2xl font-bold text-white mb-2' }, t.contact.successTitle),
                    h('p', { className: 'text-white/70 text-sm mb-6 leading-relaxed' }, t.contact.successMsg),
                    h('button', {
                      type: 'button',
                      onClick: () => setFormStatus('idle'),
                      className: 'w-full bg-[#D4AF37] hover:bg-[#C5A059] text-[#0A0F1D] font-bold py-3 rounded-xl transition-all'
                    }, t.contact.closeBtn)
                  )
                : h('div', null,
                    h('div', { className: 'w-16 h-16 rounded-full bg-red-500/10 border border-red-500/30 flex items-center justify-center mx-auto mb-4 text-red-400' },
                      h(Icon, { name: 'alert-circle', className: 'w-8 h-8' })
                    ),
                    h('h3', { className: 'text-2xl font-bold text-white mb-2' }, 'Error'),
                    h('p', { className: 'text-white/70 text-sm mb-6 leading-relaxed' }, t.contact.errorMsg),
                    h('button', {
                      type: 'button',
                      onClick: () => setFormStatus('idle'),
                      className: 'w-full bg-white/10 hover:bg-white/20 text-white font-bold py-3 rounded-xl transition-all'
                    }, t.contact.closeBtn)
                  )
            )
          )
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(h(App));
    });
  </script>
